<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        padding: 20px;
        margin: 0;
      }
      .account-container {
        max-width: 600px;
        margin: 40px auto;
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-top: 0;
        color: #333;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
      }
      h3 {
        color: #555;
        margin-top: 25px;
      }

      /* Profile Picture Section */
      .profile-header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 20px;
        margin-bottom: 30px;
      }
      .profile-pic {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #007bff;
      }
      .upload-btn {
        background: #e9ecef;
        border: 1px solid #ccc;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
      }
      .upload-btn:hover {
        background: #d3d9df;
      }

      /* Form Styles */
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #444;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 16px;
      }

      /* Buttons */
      .btn-primary {
        background: #007bff;
        color: white;
        border: none;
        padding: 12px 15px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        font-weight: bold;
        transition: 0.3s;
      }
      .btn-primary:hover {
        background: #0056b3;
      }

      .btn-danger {
        background: #dc3545;
        color: white;
        border: none;
        padding: 12px 15px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
        margin-top: 20px;
        font-weight: bold;
      }
      .btn-danger:hover {
        background: #a71d2a;
      }

      hr {
        margin: 30px 0;
        border: 0;
        border-top: 1px solid #eee;
      }
      .back-btn {
        background: none;
        border: none;
        color: #007bff;
        cursor: pointer;
        font-size: 16px;
        margin-bottom: 20px;
        display: inline-block;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="account-container">
      <button class="back-btn" onclick="window.location.href = 'index.html'">
        ⬅ Back to Home
      </button>

      <h2>My Account</h2>

      <div class="profile-header">
        <img
          src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png"
          alt="Profile"
          class="profile-pic"
          id="profileImagePreview"
        />
        <div>
          <input
            type="file"
            id="profilePictureInput"
            accept="image/*"
            style="display: none"
          />
          <button
            class="upload-btn"
            onclick="document.getElementById('profilePictureInput').click()"
          >
            📷 Upload Picture
          </button>
        </div>
      </div>

      <h3>Edit Profile</h3>
      <form id="editProfileForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="emailAddress" required />
        </div>
        <button type="submit" class="btn-primary">Save Changes</button>
      </form>

      <hr />

      <h3>Change Password</h3>
      <form id="changePasswordForm">
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" id="currentPassword" required />
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" required />
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPassword" required />
        </div>
        <button type="submit" class="btn-primary">Update Password</button>
      </form>

      <button class="btn-danger" onclick="logout()">Log Out</button>
    </div>

    <script src="js/myAccount.js"></script>
  </body>
</html>
