<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Ticket || Mera Safar</title>
    <link rel="stylesheet" href="./css/pdf.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <div class="action-buttons">
      <button
        class="btn btn-home"
        onclick="window.location.href = 'index.html'"
      >
        Back to Home
      </button>
      <button class="btn btn-download" onclick="downloadPDF()">
        Download PDF Again
      </button>
    </div>

    <div id="pdfTicketContainer">
      <div id="ticketContent" class="ticket-card">
        <div class="ticket-header">
          <h1>MERA SAFAR</h1>
          <p>Safar Aapka, Zimmedari Hamari</p>
        </div>

        <div class="ticket-info-top">
          <div>
            <h2>Booking Confirmation</h2>
            <p><strong>Booking ID:</strong> <span id="tkt-id"></span></p>
            <p><strong>Date & Time:</strong> <span id="tkt-time"></span></p>
          </div>
          <div class="status">
            <h3>Status: CONFIRMED ✅</h3>
          </div>
        </div>

        <table class="ticket-table">
          <tr class="bg-light">
            <td><strong>Passenger Name:</strong></td>
            <td id="tkt-name"></td>
          </tr>
          <tr>
            <td><strong>Package Name:</strong></td>
            <td id="tkt-package"></td>
          </tr>
          <tr class="bg-light">
            <td><strong>Travel Date:</strong></td>
            <td id="tkt-date"></td>
          </tr>
          <tr>
            <td><strong>Total Travellers:</strong></td>
            <td id="tkt-pax"></td>
          </tr>
          <tr class="bg-light">
            <td><strong>Contact Detail:</strong></td>
            <td>
              <span id="tkt-email"></span> | <span id="tkt-mobile"></span>
            </td>
          </tr>
        </table>

        <div class="ticket-total">
          <h3>
            Total Amount Paid: <span class="highlight" id="tkt-price"></span>
          </h3>
        </div>

        <div class="ticket-footer">
          <p>Please carry a valid ID proof during your travel.</p>
          <p>Thank you for choosing Mera Safar!</p>
        </div>
      </div>
    </div>

    <script src="./js/pdf.js"></script>
  </body>
</html>
